# One-shot: copy Apple signing secrets from this repo to jeroen-meijer/sift.
# Triggered manually; requires secret SIFT_COPY_TOKEN (gh PAT with repo scope on sift).
# Delete this workflow and SIFT_COPY_TOKEN after a successful run.
name: Copy Apple secrets to sift

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  copy:
    runs-on: ubuntu-latest
    steps:
      - name: Copy secrets to sift
        env:
          GH_TOKEN: ${{ secrets.SIFT_COPY_TOKEN }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_CONTENT: ${{ secrets.APPLE_API_KEY_CONTENT }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "error: SIFT_COPY_TOKEN secret missing" >&2
            exit 1
          fi
          for name in \
            APPLE_CERTIFICATE \
            APPLE_CERTIFICATE_PASSWORD \
            KEYCHAIN_PASSWORD \
            APPLE_SIGNING_IDENTITY \
            APPLE_API_ISSUER \
            APPLE_API_KEY \
            APPLE_API_KEY_CONTENT
          do
            eval "val=\${$name:-}"
            if [ -z "$val" ]; then
              echo "error: source secret $name is empty" >&2
              exit 1
            fi
            printf '%s' "$val" | gh secret set "$name" --repo jeroen-meijer/sift
            echo "set $name on sift"
          done
